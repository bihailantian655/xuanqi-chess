name: Build PWA & Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate game bundle
        run: |
          test -f index.html
          test -f manifest.webmanifest
          test -f sw.js
          test -f icons/icon-192.png
          test -f icons/icon-512.png
          grep -q '<canvas id="board"' index.html
          grep -q 'rel="manifest"' index.html
          echo "OK: game bundle $(wc -c < index.html) bytes + PWA shell"

      - name: Assemble static site
        run: |
          mkdir -p dist/icons
          cp index.html manifest.webmanifest sw.js dist/
          cp icons/*.png dist/icons/
          printf 'User-Agent: *\nAllow: /\n' > dist/robots.txt

      - name: Package downloadable bundle
        run: |
          cd dist && zip -r ../xuanqi-pwa.zip .

      - uses: actions/configure-pages@v5
        with:
          enablement: true   # 首次部署自动启用 Pages，无需手动到 Settings 里设置

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/upload-artifact@v4
        with:
          name: xuanqi-pwa-zip
          path: xuanqi-pwa.zip

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
